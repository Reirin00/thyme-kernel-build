name: Build thyme Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Repository'
        required: true
        default: 'https://github.com/cctv18/kernel_xiaomi_sm8250_mod'
      kernel_branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'android14-lineage22-mod'
      defconfig:
        description: 'Defconfig Name'
        required: true
        default: 'thyme_defconfig'
      apply_features:
        description: 'Apply BBR/LZ4/Kyber & Source Optimizations'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/cctv18/kernel_xiaomi_sm8250_mod' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android14-lineage22-mod' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'thyme_defconfig' }}
      APPLY_FEATURES: ${{ github.event.inputs.apply_features || 'true' }}
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git zip unzip cpio kmod python3 ca-certificates ccache

      - name: Clone Kernel Source
        run: |
          git clone --recursive --shallow-submodules --depth=1 \
            -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Clone Proton-Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton-clang

      - name: Lock Vermagic (Prevent '+' or '-dirty' Suffix)
        working-directory: kernel
        run: |
          sed -i 's/echo "+"/# echo "+"/g' scripts/setlocalversion
          sed -i 's/printf "%s" -dirty/# printf "%s" -dirty/g' scripts/setlocalversion
          # ⚠️ 关键：源码树 Makefile 是 4.19.325，但设备 vendor 模块（WiFi/音频/相机）
          #    是按 4.19.157 编译的，vermagic 不匹配会全部拒载。
          #    把 SUBLEVEL 改成 157 让 vermagic 对齐（4.19 stable 内部 ABI 基本兼容）。
          echo "--- 改前 ---"; grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 157/' Makefile
          echo "--- 改后 ---"; grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" Makefile

          # 默认 TCP 拥塞控制改为 BBR：choice 成员名是 DEFAULT_BBR（不是 DEFAULT_TCP_CONG_BBR）
          # 直接改 Kconfig default，比注入 choice 更可靠（syncconfig 不会覆盖）
          echo "--- 改前 ---"; grep -nA1 "Default TCP congestion control" net/ipv4/Kconfig | head -3
          sed -i 's/^\tdefault DEFAULT_CUBIC$/\tdefault DEFAULT_BBR/' net/ipv4/Kconfig
          echo "--- 改后 ---"; grep -nA1 "Default TCP congestion control" net/ipv4/Kconfig | head -3

      - name: "Source patches DISABLED"
        run: |
          echo "源码级补丁已全部移除。"
          echo "原因：Gemini 建议的 11 项补丁中有 6 处硬错误，其中"
          echo "  -fno-semantic-interposition 是 GCC 专有选项，clang 直接报 unknown argument"
          echo "  导致 Compile Kernel Image 必然失败。"
          echo "其余 5 处（PELT delta<<=1 / 热控绕过 / wakelock 黑名单 / GPU idle / sugov 去粘滞）"
          echo "会引入逻辑错误、WiFi 息屏断流、频率抖动等运行期问题。"
          echo ""
          echo "如需重新引入，必须先修正上述问题，并单独验证。"
      - name: Integrate KernelSU v1.0.5 + SUSFS (4.19)
        working-directory: kernel
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/patches"

          echo "=== 1) KernelSU v0.9.5 ==="
          echo "  选版本的三条硬约束："
          echo "  (a) 必须能接 susfs4ksu 的 4.19 补丁——那套补丁改的是老结构文件"
          echo "      （kernel/ksu.c、core_hook.c、sucompat.c、throne_tracker.c），"
          echo "      KernelSU 在 v1.0.x 之后重构成了 core/ feature/ hook/ 新结构，对不上。"
          echo "  (b) sepolicy.c 必须支持 4.19 的 SELinux 内部结构。"
          echo "      v1.0.x 只判断 5.8/5.9，用的 filename_trans_key + ebitmap 是 5.4+ 的模型；"
          echo "      4.19 是 struct filename_trans(含 stype) + hashtab，模型完全不同。"
          echo "      v0.9.5 有 6 处版本判断（含 5.7 / 5.1），<5.7 分支走老模型。"
          echo "  (c) 越老越好但别太老——v0.9.5 是最后一个带老结构 + 4.19 SELinux 分支的版本。"
          echo "  补丁 ksu095_susfs.patch = 10_enable 补丁在 v0.9.5 上合并 7 个失败 hunk 的结果，"
          echo "  已用 git apply --check 在干净树上验证过。"
          git clone -q --depth=1 -b v0.9.5 https://github.com/tiann/KernelSU.git KernelSU
          echo "  KSU HEAD = $(git -C KernelSU rev-parse --short HEAD)"

          echo "=== 2) ksu095_susfs.patch ==="
          patch -p1 -d KernelSU --dry-run -i "$P/ksu095_susfs.patch" || { echo "  !! dry-run 失败"; exit 1; }
          patch -p1 -d KernelSU -i "$P/ksu095_susfs.patch" || { echo "  !! 补丁打不上"; exit 1; }
          [ -f KernelSU/kernel/core_hook.c.rej ] && { echo "  !! 有 reject"; exit 1; }
          grep -q '^config KSU_SUSFS$' KernelSU/kernel/Kconfig \
            && echo "  [OK] Kconfig 已含 KSU_SUSFS" \
            || { echo "  !! Kconfig 没有 KSU_SUSFS"; exit 1; }
          grep -q 'susfs_is_current_ksu_domain' KernelSU/kernel/selinux/selinux.c \
            && echo "  [OK] selinux.c 有 susfs_is_current_ksu_domain" \
            || { echo "  !! selinux.c 缺 SUSFS 函数"; exit 1; }

          echo "=== 3) 挂进内核树 ==="
          ln -sfn "$(pwd)/KernelSU/kernel" drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          ls -ld drivers/kernelsu
          grep -c kernelsu drivers/Makefile drivers/Kconfig

          echo "=== 4) 50_add_susfs_in_kernel-4.19.patch ==="
          # 75+ hunk，允许个别失败（.rej 会被列出来逐个处理）
          patch -p1 -i "$P/50_add_susfs_in_kernel-4.19.patch" || true
          if find . -name '*.rej' | grep -q .; then
            echo "  --- 以下 hunk 未打上 ---"
            find . -name '*.rej' | sed 's/^/    /'
          else
            echo "  [OK] 全部 hunk 打上，无 .rej"
          fi

          echo "=== 5) SUSFS 源文件 ==="
          cp "$P/susfs_fn/susfs.c" "$P/susfs_fn/sus_su.c" fs/
          cp "$P/susfs_fn/susfs.h" "$P/susfs_fn/susfs_def.h" "$P/susfs_fn/sus_su.h" include/linux/
          grep -n 'susfs' fs/Makefile || echo "  !! fs/Makefile 没有 susfs.o"

          echo "=== 5.5) 三处修正 ==="
          # (a) 50 号补丁的 dcache.c 段用了新版 SUSFS 的 current->susfs_task_state
          #     + TASK_STRUCT_NON_ROOT_USER_APP_PROC，需要往 struct task_struct 加字段。
          #     但本分支的 susfs_def.h 用的是老方案：thread_info.flags 的
          #     TIF_NON_ROOT_USER_APP_PROC(bit 33)，并提供了
          #     susfs_is_current_non_root_user_app_proc()。补丁里其余 5 处都用后者，
          #     只有 dcache.c 这 2 处漏改 —— 统一到后者，不去动 task_struct 布局。
          sed -i 's/current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC/susfs_is_current_non_root_user_app_proc()/g' fs/dcache.c
          if grep -q 'susfs_task_state' fs/dcache.c; then
            echo "  !! dcache.c 仍有 susfs_task_state"; grep -n susfs_task_state fs/dcache.c; exit 1
          fi
          echo "  [OK] dcache.c 已统一到 susfs_is_current_non_root_user_app_proc()"

          # (b) MODULE_IMPORT_NS 是 5.10 才有的符号命名空间宏，4.19 里是未定义标识符，
          #     standalone 一行会被当成 "int MODULE_IMPORT_NS(...)" 函数声明。
          sed -i '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/d' drivers/kernelsu/ksu.c
          if grep -q 'MODULE_IMPORT_NS' drivers/kernelsu/ksu.c; then
            echo "  !! ksu.c 仍有 MODULE_IMPORT_NS"; exit 1
          fi
          echo "  [OK] ksu.c 已删除 MODULE_IMPORT_NS（4.19 无此宏）"

          # (c) 两处链接期 undefined symbol：
          #   c1) is_manager —— 事件里把定义改名成 ksu_is_manager 了，但 core_hook.c:130
          #       的调用点漏改（throne_tracker.c 里的 is_manager 是局部变量，不能动）
          sed -i 's/if (is_manager()) {/if (ksu_is_manager()) {/' drivers/kernelsu/core_hook.c
          if grep -q 'if (is_manager()) {' drivers/kernelsu/core_hook.c; then
            echo "  !! core_hook.c 仍有 is_manager 调用"; exit 1
          fi
          echo "  [OK] core_hook.c: is_manager -> ksu_is_manager"

          # (d) 隐藏性：LSM 注册名不能叫 "ksu"
          #     security_add_hooks(ksu_hooks, N, "ksu") 会把名字写进
          #     /sys/kernel/security/lsm，读出来是 "capability,selinux,ksu" —— 等于挂牌。
          #     本内核实测只编了 capability / selinux / landlock
          #     （landlock_add_rule、selinux_inode_alloc_security、cap_capable 在，
          #       yama/loadpin/safesetid/integrity/smack/tomoyo/apparmor/bpf 全不在），
          #     所以借 "bpf"：CONFIG_LSM 默认串里本来就有它排最后，
          #     且 lsm_append() 不查重，必须选一个确实没编的，否则会出现两个同名项。
          sed -i 's/ARRAY_SIZE(ksu_hooks), "ksu"/ARRAY_SIZE(ksu_hooks), "bpf"/' drivers/kernelsu/core_hook.c
          if grep -q 'ARRAY_SIZE(ksu_hooks), "ksu"' drivers/kernelsu/core_hook.c; then
            echo "  !! LSM 改名没生效"; exit 1
          fi
          echo "  [OK] LSM 注册名 ksu -> bpf"

          #   c2) path_umount —— KernelSU 的 Makefile 会用 sed 把 path_umount 插到
          #       fs/namespace.c 的 'static bool is_mnt_ns_file' 之前，但：
          #         · 它依赖 can_umount()，那是 5.9 才有的权限检查函数，4.19 没有
          #         · $(shell sed) 失败不报错（$(info) 只是打印），所以"看起来插了"其实没插
          #         · drivers 在 fs 之后编译，此时 namespace.o 早已生成，即使插了也不重编
          #       所以在 50 号补丁之后、编译之前，直接给 4.19 补一个走 do_umount 的版本。
          python3 "$GITHUB_WORKSPACE/patches/add_path_umount.py" fs/namespace.c fs/internal.h

          echo "=== 6) 落点校验 ==="
          grep -q 'CONFIG_KSU_SUSFS' fs/Makefile && echo "  [OK] fs/Makefile 已接 susfs.o"
          grep -q 'susfs_def.h' fs/namespace.c && echo "  [OK] namespace.c 引入 susfs_def.h"
          grep -q 'SUSFS' kernel/kallsyms.c && echo "  [OK] kallsyms.c 有符号隐藏"
          grep -q 'susfs_is_current_ksu_domain' fs/susfs.c && echo "  [OK] susfs.c 就位"

      - name: Generate Base Defconfig
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 "$DEFCONFIG"

      - name: Inject Kconfig Features & Resolve Dependencies
        if: env.APPLY_FEATURES == 'true'
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          # 方案B: 直接向 defconfig 源追加配置行(kconfig 将其全部作为用户选择, choice 项必胜)
          cat >> arch/arm64/configs/"$DEFCONFIG" <<'CFGEOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          # CONFIG_KSM is not set
          # 关闭模块 CRC 校验：源码是 4.19.325，设备 vendor 模块按 4.19.157 编译，
          # MODVERSIONS 会让所有 vendor 模块因 CRC 不匹配而拒载 → 系统起不来
          # CONFIG_MODVERSIONS is not set
          CONFIG_ZSTD_COMPRESS=y
          CONFIG_ZSTD_DECOMPRESS=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          CONFIG_MQ_IOSCHED_KYBER=y
          # CONFIG_UCLAMP_TASK is not set
          # CONFIG_UCLAMP_TASK_GROUP is not set
          # ---- KernelSU + SUSFS ----
          CONFIG_KSU=y
          # kprobes：KernelSU v1.0.5 的 hook 机制（prctl / renameat）
          # 原厂 config 里 KPROBES=n，但 HAVE_KPROBES=y，可以开
          CONFIG_KPROBES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          # 日志必须关：susfs 的 pr_info 会把被隐藏的路径/mnt_id 打进 dmesg
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          # sus_su 需要额外的用户态工具，第一轮先不开
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          # 隐藏性：/proc/config.gz 是 S_IRUGO(0444)，谁都能读，读出来第一眼就是
          # CONFIG_KSU=y / CONFIG_KSU_SUSFS=y。保留 IKCONFIG=y（内核里仍存 .config，
          # 万一要 kdump 还能用），只关掉对外暴露的 /proc 接口。
          # CONFIG_IKCONFIG_PROC is not set
          CFGEOF
          # 重新生成 .config(含追加项), 再处理 LOCALVERSION
          make O=out ARCH=arm64 "$DEFCONFIG"
          chmod +x ./scripts/config
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO --set-str LOCALVERSION "-perf"
          # ⚠️ 这三个 CPU_MASK 是 **int/hex 类型**（不是 string），Kconfig 默认 0。
          #    用 --set-str 会写成 ""0-3"" 双引号嵌套 → 判非法 → syncconfig 无限
          #    "Error in reading or end of file."（非交互 stdin EOF 死循环）
          #    正确做法来自上游 .github/workflows/Build_Kernel.yml:389-391
          #    15=0xF(CPU0-3) / 112=0x70(CPU4-6) / 128=0x80(CPU7)
          set_cpu_mask() {
            sed -i "/^CONFIG_$1=/d" out/.config
            printf 'CONFIG_%s=%s\n' "$1" "$2" >> out/.config
          }
          set_cpu_mask LITTLE_CPU_MASK  15
          set_cpu_mask BIG_CPU_MASK     112
          set_cpu_mask PRIME_CPU_MASK   128
          make O=out ARCH=arm64 olddefconfig
          # choice 派生字符串直改(编译期 autoconf.h 原样采用, 不再跑 olddefconfig)
          sed -i 's/^CONFIG_DEFAULT_TCP_CONG=.*/CONFIG_DEFAULT_TCP_CONG="bbr"/' out/.config
          sed -i 's/^CONFIG_DEFAULT_NET_SCH=.*/CONFIG_DEFAULT_NET_SCH="fq"/' out/.config
          grep -E '^CONFIG_DEFAULT_TCP_CONG|^CONFIG_DEFAULT_NET_SCH' out/.config
          # 兜底：olddefconfig 之后若又被改回默认 0，再覆盖一次
          set_cpu_mask LITTLE_CPU_MASK  15
          set_cpu_mask BIG_CPU_MASK     112
          set_cpu_mask PRIME_CPU_MASK   128
          # 断言：必须是 15/112/128（配合 bash -e，失败显式中止而不是静默卡死）
          grep -E '^CONFIG_LITTLE_CPU_MASK=15$' out/.config
          grep -E '^CONFIG_BIG_CPU_MASK=112$'   out/.config
          grep -E '^CONFIG_PRIME_CPU_MASK=128$' out/.config
      - name: Verify Effective .config
        if: env.APPLY_FEATURES == 'true'
        working-directory: kernel
        run: |
          grep -E '^CONFIG_LOCALVERSION="-perf"$' out/.config
          grep -E '^CONFIG_TCP_CONG_BBR=y$' out/.config
          grep -E '^CONFIG_DEFAULT_TCP_CONG="bbr"$' out/.config
          grep -E '^CONFIG_NET_SCH_FQ=y$' out/.config
          grep -E '^CONFIG_ZSTD_COMPRESS=y$' out/.config
          grep -E '^CONFIG_ZRAM_DEF_COMP_LZ4=y$' out/.config
          grep -E '^CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y$' out/.config
          grep -E '^CONFIG_MQ_IOSCHED_KYBER=y$' out/.config
          ! grep -E '^CONFIG_KSM=y$' out/.config
          ! grep -E '^CONFIG_UCLAMP_TASK=y$' out/.config

      - name: Compile Kernel Image
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            Image

      - name: Verify Compiled Kernel Image & Vermagic
        working-directory: kernel
        run: |
          test -f out/arch/arm64/boot/Image
          VER_STR=$(strings out/arch/arm64/boot/Image | grep -m1 "Linux version 4.19")
          echo "Detected: $VER_STR"
          echo "$VER_STR" | grep -q "4.19.157-perf " || exit 1

      - name: Package AnyKernel3 Zip (Strictly No dtbo.img)
        run: |
          # ⚠️ 上游模板写的 easterNday/AnyKernel3 已 404，改用官方 osm0sis/AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/dtbo.img AnyKernel3/dtb
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          # ---- ak3-core.sh 用 #15 验证过的那一版，不用上游最新 ----
          # 上游现在的版本和 #15 那份差 74 字节，三处：
          #   - 删掉了 `2) touch chromeos;;`（magiskboot unpack 返回 2 时打标记）
          #   - chromeos 签名从 `if [ -f "$SPLITIMG/chromeos" ]` 守卫改成无条件执行
          #   - AVB 签名从 `magiskboot sign` 改成 `magiskboot sign-avb1`
          # 对本设备这三处都不触发（tools 里没有 avb/ 目录、boot.img 不是 chromeos 格式、
          # unpack 不会返回 2），但 #15 是唯一验证过能刷进去的版本，照抄它最省事。
          # 注意 tools/magiskboot 本身两版 md5 相同（878652 B），只换脚本。
          cp "$GITHUB_WORKSPACE/patches/ak3/ak3-core.sh" AnyKernel3/tools/ak3-core.sh
          md5sum AnyKernel3/tools/ak3-core.sh
          grep -q 'magiskboot sign /' AnyKernel3/tools/ak3-core.sh \
            && echo "  [OK] ak3-core.sh 是 #15 版（magiskboot sign）" \
            || { echo "!! ak3-core.sh 不是 #15 版"; exit 1; }

          # thyme 专用 anykernel.sh：A/B 设备，只刷 boot 分区（vendor_boot 不动）
          echo '' | base64 -d > AnyKernel3/anykernel.sh
          echo "--- anykernel.sh ---"; head -6 AnyKernel3/anykernel.sh

          cd AnyKernel3
          ZIP_NAME="thyme-kernel-${GITHUB_RUN_NUMBER}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*" "README.md" "*placeholder*"
          cd ..

          unzip -l "${ZIP_NAME}"
          ! unzip -l "${ZIP_NAME}" | grep -qi "dtbo"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
