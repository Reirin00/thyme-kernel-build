name: Build thyme Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source Repository'
        required: true
        default: 'https://github.com/cctv18/kernel_xiaomi_sm8250_mod'
      kernel_branch:
        description: 'Kernel Source Branch'
        required: true
        default: 'android14-lineage22-mod'
      defconfig:
        description: 'Defconfig Name'
        required: true
        default: 'thyme_defconfig'
      apply_features:
        description: 'Apply BBR/LZ4/Kyber & Source Optimizations'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/cctv18/kernel_xiaomi_sm8250_mod' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android14-lineage22-mod' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'thyme_defconfig' }}
      APPLY_FEATURES: ${{ github.event.inputs.apply_features || 'true' }}
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git zip unzip cpio kmod python3 ca-certificates ccache

      - name: Clone Kernel Source
        run: |
          git clone --recursive --shallow-submodules --depth=1 \
            -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Clone Proton-Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton-clang

      - name: Lock Vermagic (Prevent '+' or '-dirty' Suffix)
        working-directory: kernel
        run: |
          sed -i 's/echo "+"/# echo "+"/g' scripts/setlocalversion
          sed -i 's/printf "%s" -dirty/# printf "%s" -dirty/g' scripts/setlocalversion

      - name: Apply Source-Level Power & Performance Patches (ABI/CRC Safe)
        if: env.APPLY_FEATURES == 'true'
        working-directory: kernel
        run: |
          python3 - << 'EOF'
          import os, re

          def patch_file(path, desc, pattern, replacement, count=1):
              if not os.path.exists(path):
                  print(f"[SKIP] {desc}: {path} not found")
                  return
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              new_content, n = re.subn(pattern, replacement, content, count=count, flags=re.M)
              if n > 0 and new_content != content:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f"[PATCH OK] {desc} ({path})")
              else:
                  print(f"[SKIP/NO MATCH] {desc} ({path})")

          # 1. Makefile 注入 -O3 与 Cortex-A77 流水线调优
          patch_file(
              "Makefile",
              "Inject -O3 and Cortex-A77 tuning flags",
              r"(KBUILD_CFLAGS\s*\+=\s*-O2)",
              r"KBUILD_CFLAGS += -O3 -mtune=cortex-a77 -fno-semantic-interposition"
          )

          # 2. 高通 WALT 调度器：采用 RECENT 窗口策略，加快高负载后的降频响应
          patch_file(
              "kernel/sched/walt.c",
              "Set WALT default window stats policy to favor recent load drop",
              r"(unsigned\s+int\s+__read_mostly\s+sysctl_sched_window_stats_policy\s*=\s*)WINDOW_STATS_MAX_RECENT_AVG;",
              r"\g<1>WINDOW_STATS_RECENT;"
          )

          # 3. PELT 半衰期缩短 (32ms -> 16ms 等效加速)
          patch_file(
              "kernel/sched/pelt.c",
              "Fast PELT decay",
              r"(delta\s*>>=\s*10;)",
              r"\1\n\tdelta <<= 1; /* 16ms effective half-life */"
          )

          # 4. 拦截 HyperOS mi_thermald 的 CPU 锁频，保留 33W 快充温控
          patch_file(
              "drivers/thermal/mi_thermal_interface.c",
              "Bypass HyperOS thermal_cpu_limits_store throttling",
              r"(static\s+ssize_t\s+thermal_cpu_limits_store\s*\([^)]*\)\s*\{)",
              r"\1\n\treturn len;"
          )
          patch_file(
              "drivers/thermal/mi_thermal_interface.c",
              "Bypass HyperOS cpu_limits_store fallback",
              r"(static\s+ssize_t\s+cpu_limits_store\s*\([^)]*\)\s*\{)",
              r"\1\n\treturn count;"
          )

          # 5. 内核级屏蔽高通 WiFi/Modem 高耗电 Wakelock（不改结构体）
          patch_file(
              "drivers/base/power/wakeup.c",
              "Block battery-draining Qualcomm wakelocks",
              r"(static\s+void\s+wakeup_source_activate\s*\(\s*struct\s+wakeup_source\s*\*ws\s*\)\s*\{)",
              r'''\1
          \tif (ws && ws->name && (
          \t    !strcmp(ws->name, "qcom_rx_wakelock") ||
          \t    !strcmp(ws->name, "wlan_pno_wl") ||
          \t    !strcmp(ws->name, "wlan_extscan_wl") ||
          \t    !strcmp(ws->name, "ipa_WS") ||
          \t    !strcmp(ws->name, "NETLINK")))
          \t\treturn;'''
          )

          # 6. 缩短 Adreno 650 GPU 空闲断电时间 (80ms -> 56ms) 并关闭 POPP
          patch_file(
              "drivers/gpu/msm/adreno.c",
              "Shorten Adreno 650 GPU idle timeout to 56ms",
              r"(#define\s+ADRENO_IDLE_TIMEOUT\s+)\(?80\)?",
              r"\g<1>56"
          )
          patch_file(
              "drivers/gpu/msm/kgsl_pwrscale.c",
              "Disable KGSL POPP overhead",
              r"(pwrscale->popp_enabled\s*=\s*)true;",
              r"\g<1>false;"
          )

          # 7. 压制 CPU Input Boost 默认时长至 40ms
          patch_file(
              "drivers/cpufreq/cpu-boost.c",
              "Cap default input_boost_ms to 40ms",
              r"(static\s+unsigned\s+int\s+input_boost_ms\s*=\s*)[0-9]+;",
              r"\g<1>40;"
          )

          # 8. 移除 schedutil 的 sugov_cpu_is_busy 粘滞升频逻辑
          patch_file(
              "kernel/sched/cpufreq_schedutil.c",
              "Disable sugov_cpu_is_busy frequency stickiness",
              r"(static\s+bool\s+sugov_cpu_is_busy\s*\([^)]*\)\s*\{)",
              r"\1\n\treturn false;"
          )

          # 9. 锁定 ZRAM 换页预读 page_cluster = 0
          patch_file(
              "mm/swap.c",
              "Set default page_cluster to 0 for ZRAM efficiency",
              r"(int\s+page_cluster\s*=\s*)[0-9]+;",
              r"\g<1>0;"
          )

          # 10. 静默 Binder 与高通总线投票内部调试日志
          patch_file(
              "drivers/android/binder.c",
              "Silence binder debug mask",
              r"(uint32_t\s+binder_debug_mask\s*=\s*)[^;]+;",
              r"\g<1>0;"
          )
          patch_file(
              "drivers/soc/qcom/msm_bus/msm_bus_dbg.c",
              "Bypass msm_bus_dbg request logging",
              r"(static\s+void\s+msm_bus_dbg_update_request\s*\([^)]*\)\s*\{)",
              r"\1\n\treturn;"
          )

          # 11. 缩短 NAPI 网络软中断单次轮询时间上限 (2000us -> 1000us)
          patch_file(
              "net/core/dev.c",
              "Reduce netdev_budget_usecs to 1000us",
              r"(unsigned\s+int\s+__read_mostly\s+netdev_budget_usecs\s*=\s*)(?:2000\s*\*\s*USEC_PER_MSEC\s*/\s*1000|2000);",
              r"\g<1>1000;"
          )
          EOF

      - name: Generate Base Defconfig
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 "$DEFCONFIG"

      - name: Inject Kconfig Features & Resolve Dependencies
        if: env.APPLY_FEATURES == 'true'
        working-directory: kernel
        run: |
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          # 方案B: 直接向 defconfig 源追加配置行(kconfig 将其全部作为用户选择, choice 项必胜)
          cat >> arch/arm64/configs/"$DEFCONFIG" <<'CFGEOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_DEFAULT_FQ=y
          # CONFIG_KSM is not set
          CONFIG_ZSTD_COMPRESS=y
          CONFIG_ZSTD_DECOMPRESS=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          CONFIG_MQ_IOSCHED_KYBER=y
          # CONFIG_UCLAMP_TASK is not set
          # CONFIG_UCLAMP_TASK_GROUP is not set
          CFGEOF
          # 重新生成 .config(含追加项), 再处理 LOCALVERSION
          make O=out ARCH=arm64 "$DEFCONFIG"
          chmod +x ./scripts/config
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO --set-str LOCALVERSION "-perf"
          make O=out ARCH=arm64 olddefconfig
      - name: Verify Effective .config
        if: env.APPLY_FEATURES == 'true'
        working-directory: kernel
        run: |
          grep -E '^CONFIG_LOCALVERSION="-perf"$' out/.config
          grep -E '^CONFIG_TCP_CONG_BBR=y$' out/.config
          grep -E '^CONFIG_DEFAULT_TCP_CONG="bbr"$' out/.config
          grep -E '^CONFIG_NET_SCH_FQ=y$' out/.config
          grep -E '^CONFIG_ZSTD_COMPRESS=y$' out/.config
          grep -E '^CONFIG_ZRAM_DEF_COMP_LZ4=y$' out/.config
          grep -E '^CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y$' out/.config
          grep -E '^CONFIG_MQ_IOSCHED_KYBER=y$' out/.config
          ! grep -E '^CONFIG_KSM=y$' out/.config
          ! grep -E '^CONFIG_UCLAMP_TASK=y$' out/.config

      - name: Compile Kernel Image
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            Image

      - name: Verify Compiled Kernel Image & Vermagic
        working-directory: kernel
        run: |
          test -f out/arch/arm64/boot/Image
          VER_STR=$(strings out/arch/arm64/boot/Image | grep -m1 "Linux version 4.19")
          echo "Detected: $VER_STR"
          echo "$VER_STR" | grep -q "4.19.157-perf " || exit 1

      - name: Package AnyKernel3 Zip (Strictly No dtbo.img)
        run: |
          git clone --depth=1 -b thyme https://github.com/easterNday/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/dtbo.img AnyKernel3/dtb
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cd AnyKernel3
          ZIP_NAME="thyme-kernel-${GITHUB_RUN_NUMBER}.zip"
          zip -r9 "../${ZIP_NAME}" * -x "*.git*" "README.md" "*placeholder*"
          cd ..

          unzip -l "${ZIP_NAME}"
          ! unzip -l "${ZIP_NAME}" | grep -qi "dtbo"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
