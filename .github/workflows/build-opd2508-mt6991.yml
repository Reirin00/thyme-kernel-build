name: Build OnePlus Pad 2 (OPD2508 / MT6991) GKI Kernel

# 目标设备：一加平板 2（OPD2508），平台 MT6991，GKI 2.0 / android15-6.6
# 集成：SukiSU-Ultra builtin(KPM) + simonpunk SUSFS + Numbersf MT6991 风驰 SCX

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repository'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      kernel_branch:
        description: 'Kernel branch (GKI 2.0)'
        required: true
        default: 'android15-6.6'
      clang_version:
        description: 'AOSP prebuilt clang'
        required: true
        default: 'clang-r510928'
      apply_all_sched_patches:
        description: '打 mt6991 分支下全部 patch（默认只打 pad2 的）'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://android.googlesource.com/kernel/common' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android15-6.6' }}
      CLANG_VER: ${{ github.event.inputs.clang_version || 'clang-r510928' }}
      APPLY_ALL_SCHED: ${{ github.event.inputs.apply_all_sched_patches || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            zip unzip cpio rsync kmod device-tree-compiler \
            python3 python3-pip git curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone kernel source (GKI android15-6.6)
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          echo "===== 内核版本 ====="
          head -6 Makefile
          echo "===== gki_defconfig ====="
          ls -la arch/arm64/configs/gki_defconfig
          echo "===== 当前 commit ====="
          git log -1 --format='%H %s'

      - name: Clone AOSP prebuilt clang
        run: |
          mkdir -p clang
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VER}.tar.gz"
          echo "下载: $URL"
          curl -LSs "$URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz
          echo "===== clang 版本 ====="
          ./clang/bin/clang --version | head -2
          ls clang/bin/ | head -5

      # ===== 1) SukiSU-Ultra（builtin 分支，原生含 SUSFS + KPM）=====
      - name: "1. Integrate SukiSU-Ultra (builtin)"
        working-directory: kernel
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

          echo "===== 校验 ====="
          test -d KernelSU || { echo "!! KernelSU 目录不存在"; exit 1; }
          echo "  KernelSU commit: $(git -C KernelSU log -1 --format='%h %s')"
          echo "  KernelSU 当前分支: $(git -C KernelSU rev-parse --abbrev-ref HEAD)"
          ls -ld drivers/kernelsu || { echo "!! drivers/kernelsu 软链不存在"; exit 1; }
          grep -n "kernelsu" drivers/Makefile
          grep -n "kernelsu/Kconfig" drivers/Kconfig
          echo "  内置 feature 目录:"
          ls KernelSU/kernel/feature/ 2>/dev/null | head -10 || true
          echo "  KPM 相关:"
          ls KernelSU/kernel/KPM 2>/dev/null | head -5 || grep -rn "CONFIG_KPM" KernelSU/kernel/Kconfig | head -3

      # ===== 2) simonpunk SUSFS（gki-android15-6.6）=====
      - name: "2. Apply simonpunk SUSFS (gki-android15-6.6)"
        working-directory: kernel
        run: |
          set -euo pipefail
          git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs
          echo "  SUSFS commit: $(git -C ../susfs log -1 --format='%h %s')"

          echo "===== 复制 SUSFS 源文件 ====="
          cp -v ../susfs/kernel_patches/fs/*            fs/
          cp -v ../susfs/kernel_patches/include/linux/* include/linux/

          echo "===== 打入 50 号 VFS 补丁 ====="
          PATCH="../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          test -f "$PATCH" || { echo "!! 找不到 $PATCH"; exit 1; }
          echo "  补丁大小: $(stat -c%s "$PATCH") B"
          patch -p1 --dry-run -i "$PATCH" > /tmp/susfs_dry.txt 2>&1 || true
          echo "  dry-run 结果: $(grep -c 'FAILED' /tmp/susfs_dry.txt || true) 处 FAILED"
          patch -p1 -i "$PATCH" || {
            echo "!! SUSFS 补丁有 hunk 失败，列出 reject："
            find . -name '*.rej' | head -20
            exit 1
          }
          echo "===== 校验 ====="
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          grep -n "susfs" fs/Makefile || { echo "!! fs/Makefile 没有 susfs.o"; exit 1; }

      # ===== 3) Numbersf MT6991 满血真风驰 SCX =====
      - name: "3. Apply MT6991 SCX (fengchi / HMBIRD) patch"
        working-directory: kernel
        run: |
          set -euo pipefail
          git clone --depth=1 -b mt6991 https://github.com/Numbersf/SCHED_PATCH.git ../sched_patch
          echo "  SCHED_PATCH commit: $(git -C ../sched_patch log -1 --format='%h %s')"
          echo "  mt6991 分支下的 patch:"
          ls -la ../sched_patch/*.patch

          # mt6991 分支同时放了 ace5_ultra 和 pad2 的补丁，是两台不同设备的。
          # 默认只打 pad2（OPD2508）那份，全打会因设备树/CPU 拓扑不同而冲突。
          if [ "$APPLY_ALL_SCHED" = "true" ]; then
            echo "===== 全量模式：应用 mt6991 分支下所有 patch ====="
            for p in ../sched_patch/*.patch; do
              echo "--- $(basename "$p") ---"
              patch -p1 --forward -i "$p" || echo "  (有 hunk 未应用，继续)"
            done
          else
            echo "===== 设备匹配模式：只应用 pad2 补丁 ====="
            P="../sched_patch/fengchi_oneplus_pad2_mt6991_b.patch"
            test -f "$P" || { echo "!! 找不到 pad2 补丁"; exit 1; }
            echo "  补丁大小: $(stat -c%s "$P") B"
            patch -p1 --dry-run -i "$P" > /tmp/scx_dry.txt 2>&1 || true
            echo "  dry-run 结果: $(grep -c 'FAILED' /tmp/scx_dry.txt || true) 处 FAILED"
            patch -p1 -i "$P" || {
              echo "!! SCX 补丁有 hunk 失败，列出 reject："
              find . -name '*.rej' | head -20
              exit 1
            }
          fi

          echo "===== 校验 ====="
          ls -la kernel/sched/hmbird/ 2>/dev/null | head -8 || { echo "!! kernel/sched/hmbird 不存在"; exit 1; }
          grep -n "CONFIG_HMBIRD_SCHED" init/Kconfig | head -3 || true
          grep -n "CONFIG_SCHED_CLASS_EXT" init/Kconfig | head -3 || true
          echo "  hmbird 文件数: $(find kernel/sched/hmbird -type f 2>/dev/null | wc -l)"

      # ===== 4) Defconfig 追加 =====
      - name: "4. Inject defconfig (gki_defconfig)"
        working-directory: kernel
        run: |
          set -euo pipefail
          CFG=arch/arm64/configs/gki_defconfig
          echo "===== 追加前: $(wc -l < $CFG) 行 ====="
          cat >> "$CFG" <<'CFGEOF'

          # SukiSU-Ultra + KPM
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KPROBES=y

          # SUSFS Full Suite
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_or_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y

          # True HMBIRD / SCX Scheduler for MT6991
          CONFIG_HMBIRD_SCHED_GKI=y
          CONFIG_SCHED_CLASS_EXT=y

          # Performance & Power Tuning
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          CFGEOF

          # 注意：SCX 补丁实际引入的 Kconfig 符号是 CONFIG_HMBIRD_SCHED（无 _GKI 后缀）。
          # 上面那份是需求方指定的清单，其中 CONFIG_HMBIRD_SCHED_GKI=y 在树里没有对应
          # Kconfig entry，conf 阶段会被静默丢弃。这里补一行真实符号，保证风驰调度器
          # 真正编进去；若补丁版本不同导致该符号也不存在，这行同样会被安全丢弃。
          grep -q '^CONFIG_HMBIRD_SCHED=y$' "$CFG" || echo 'CONFIG_HMBIRD_SCHED=y' >> "$CFG"

          echo "===== 追加后: $(wc -l < $CFG) 行 ====="
          tail -35 "$CFG"

      - name: Generate .config and verify
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          echo "===== .config 关键项 ====="
          for k in KSU KPM KPROBES KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_ENABLE_LOG \
                   HMBIRD_SCHED HMBIRD_SCHED_GKI SCHED_CLASS_EXT TCP_CONG_BBR \
                   DEFAULT_BBR NET_SCH_FQ CRYPTO_LZ4; do
            printf "  %-32s %s\n" "$k" "$(grep -E "^CONFIG_${k}=" out/.config || echo '(未生效)')"
          done
          echo "===== .config 行数: $(wc -l < out/.config) ====="

      - name: Compile kernel Image
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          echo "cpus: $(nproc)  mem: $(free -g | awk '/^Mem:/{print $2}')G"
          make O=out ARCH=arm64 LLVM=1 Image -j"$(nproc)" 2>&1 | tail -80
          echo "===== 产物 ====="
          ls -la out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Verify Image
        working-directory: kernel
        run: |
          IMG=out/arch/arm64/boot/Image
          test -f "$IMG" || { echo "!! 没有 Image"; exit 1; }
          SZ=$(stat -c%s "$IMG")
          echo "Image 大小: $SZ B ($((SZ/1024/1024)) MB)"
          [ "$SZ" -gt 20000000 ] || { echo "!! Image 太小，可能编译失败"; exit 1; }
          echo "===== vermagic ====="
          strings "$IMG" | grep -m2 "Linux version"
          echo "===== 关键符号 ====="
          for s in susfs_init susfs_add_sus_path ksu_escape_to_root scx_sched_gki_ops; do
            printf "  %-24s %s\n" "$s" "$(strings "$IMG" | grep -c "$s")"
          done

      - name: "Package AnyKernel3 (GKI boot 分区只换 kernel)"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/dtbo.img AnyKernel3/dtb
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          # GKI 2.0：boot 分区含 GKI kernel + 通用 ramdisk；vendor 部分在 vendor_boot。
          # 所以只替换 kernel，ramdisk 保持原样，不做 slot 自动探测（平板是 A/B）。
          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() { '
          kernel.string=OnePlus Pad 2 (OPD2508) GKI - SukiSU+SUSFS+HMBIRD
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OPD2508
          device.name2=OnePlus Pad 2
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot_a;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=0;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AK3EOF

          cd AnyKernel3
          ZIP="opd2508-kernel-${GITHUB_RUN_NUMBER}.zip"
          zip -r9 "../${ZIP}" * -x "*.git*" "README.md" "*placeholder*"
          cd ..
          unzip -l "${ZIP}"
          ! unzip -l "${ZIP}" | grep -qi "dtbo"
          echo "ZIP=${ZIP}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opd2508-kernel-${{ github.run_number }}
          path: |
            ${{ env.ZIP }}
            kernel/out/arch/arm64/boot/Image
          retention-days: 30

      - name: Create release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="opd2508-mt6991-k${GITHUB_RUN_NUMBER}"
          ZIP="${ZIP}"
          [ -f "$ZIP" ] || { echo "!! 找不到 $ZIP"; ls -la; exit 1; }
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          IMG=kernel/out/arch/arm64/boot/Image
          IMGMD5=$(md5sum "$IMG" | cut -d' ' -f1)

          {
            echo "# 一加平板 2（OPD2508 / MT6991）GKI 内核"
            echo ""
            echo "构建 #${GITHUB_RUN_NUMBER} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            echo "zip   md5: $MD5"
            echo "Image md5: $IMGMD5"
            echo "Image size: $(stat -c%s "$IMG") B"
            echo '```'
            echo ""
            echo "## 组成"
            echo ""
            echo "- SukiSU-Ultra **builtin** 分支（原生 SUSFS + KPM）"
            echo "- simonpunk SUSFS \`gki-android15-6.6\`（50 号 VFS 补丁 + susfs.c/h）"
            echo "- Numbersf MT6991 满血风驰 SCX（\`fengchi_oneplus_pad2_mt6991_b.patch\`）"
            echo "- BBR / FQ / LZ4 / WQ_POWER_EFFICIENT"
            echo ""
            echo "## 刷入"
            echo ""
            echo '```'
            echo "# TWRP → Install（推荐，和原机 recovery 环境一致）"
            echo "# 或 fastboot："
            echo "fastboot flash boot boot.img"
            echo '```'
            echo ""
            echo "⚠️ 首次刷入前务必备份当前 boot 分区。"
          } > notes.md

          gh release create "$TAG" "$ZIP" -R "${GITHUB_REPOSITORY}" \
            --title "OnePlus Pad 2 OPD2508 · GKI 6.6 · SukiSU+SUSFS+HMBIRD (k${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --prerelease
